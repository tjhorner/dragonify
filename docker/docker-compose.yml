services:
  dragonify:
    container_name: dragonify
    image: ghcr.io/casse-boubou/dragonify:v1.1.2@sha256:4c611ae402e718b3e66e8ee66a0986470cd0b9558b45a01d7cd3b57b8117791b
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
      - CONNECT_ALL=false
      - CUSTOMS_NETWORKS=ix-dragonify_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro